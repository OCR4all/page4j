name: CI (Snapshots)

# Publishes <next patch>-SNAPSHOT (1.0.0-SNAPSHOT before the first release) to
# https://central.sonatype.com/repository/maven-snapshots/ on every push to main.
# Run it manually to publish a snapshot of another branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v3

      - name: Set snapshot version
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [[ -z "$latest" ]]; then
            next=1.0.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="${major}.${minor}.$((${patch%%-*} + 1))"
          fi
          echo "VERSION=${next}-SNAPSHOT" >> "$GITHUB_ENV"
          echo "Publishing ${next}-SNAPSHOT" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: './gradlew build -Pversion=${VERSION}'

      - name: Publish snapshot to Maven Central
        run: './gradlew publishToMavenCentral -Pversion=${VERSION}'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: '${{ secrets.CENTRAL_USERNAME }}'
          ORG_GRADLE_PROJECT_mavenCentralPassword: '${{ secrets.CENTRAL_PASSWORD }}'
          ORG_GRADLE_PROJECT_signingInMemoryKey: '${{ secrets.GPG_PRIVATE_KEY }}'
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: '${{ secrets.GPG_PASSPHRASE }}'
